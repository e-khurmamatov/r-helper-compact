[package]
name = "rhelper-controller"
version = "0.10.0"
edition = "2024"
description = "R-Helper Compact hardware controller"
authors = ["Fatalution", "R-Helper Compact contributors"]
license = "MIT"
publish = false
repository = "https://github.com/e-khurmamatov/r-helper-compact"

[[bin]]
name = "rhelper-controller"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.89"
librazer = { path = "../librazer" }
strum = { version = "0.28.0", features = ["derive"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"

[target.'cfg(windows)'.dependencies]
app-single-instance = "0.1"
winreg = "0.56"
wmi = "0.18.4"
nvml-wrapper = "0.13.0"
windows = { version = "0.62.0", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
