name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/change-scope.yml
  analyze:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.run_checks != 'false') }}
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            os: windows-2022
            build-mode: manual
          - language: rust
            os: windows-2022
            build-mode: none
          - language: actions
            os: ubuntu-latest
            build-mode: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up Rust
        if: matrix.language == 'rust'
        shell: pwsh
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: github/codeql-action/init@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build WinUI for analysis
        if: matrix.language == 'csharp'
        shell: pwsh
        run: |
          dotnet build winui/RHelper.Compact.csproj -c Release -p:RestoreLockedMode=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: '/language:${{ matrix.language }}'
  result:
    name: Code analysis
    needs: [changes, analyze]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful analysis or documentation-only skip
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          RUN_CHECKS: ${{ needs.changes.outputs.run_checks }}
          ANALYSIS_RESULT: ${{ needs.analyze.result }}
        run: |
          if [[ "$ANALYSIS_RESULT" == "success" ]]; then
            exit 0
          fi
          if [[ "$SCOPE_RESULT" == "success" && "$RUN_CHECKS" == "false" && "$ANALYSIS_RESULT" == "skipped" ]]; then
            echo "Documentation only: no code analysis required."
            exit 0
          fi
          echo "Code analysis did not complete successfully."
          exit 1
