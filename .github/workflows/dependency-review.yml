name: Dependency review
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  changes:
    uses: ./.github/workflows/change-scope.yml
  dependency-review:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.run_checks != 'false') }}
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
