name: Detect documentation-only changes
on:
  workflow_call:
    outputs:
      run_checks:
        value: ${{ jobs.scope.outputs.run_checks }}
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_checks: ${{ steps.scope.outputs.run_checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: python3 scripts/ci_scope.py
